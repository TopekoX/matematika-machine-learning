# ---------------------------------------------------------------------------
# Matematika untuk Machine Learning (MkDocs + Material).
# Edit: site identity, `nav`, and (optionally) palette.
# ---------------------------------------------------------------------------

# --- Site identity ---------------------------------------------------------
site_name: Matematika untuk Machine Learning
site_description: Belajar matematika untuk Machine Learning dan Deep Learning dalam bahasa Indonesia, dari pemula hingga tingkat lanjut.
# Canonical URL. For GitHub Pages: https://<user>.github.io/<repo>/
site_url: https://topekox.github.io/matematika-machine-learning/
# Repository + "edit this page" links. Remove these three lines if not wanted.
repo_url: https://github.com/topekox/matematika-machine-learning
repo_name: TopekoX/matematika-machine-learning
edit_uri: edit/main/docs/

# --- Theme (shared) --------------------------------------------------------
theme:
  name: material
  language: id
  font: false # system fonts; no Google Fonts request
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path # breadcrumbs
    - navigation.footer # previous / next links
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  # Native three-state switcher: System -> Light -> Dark.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: "Tema: sistem (klik untuk terang)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Tema: terang (klik untuk gelap)"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: "Tema: gelap (klik untuk sistem)"

